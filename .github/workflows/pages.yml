name: Build and verify live Flow Garden website

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'site/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'site/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flow-garden-pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out garden
        uses: actions/checkout@v4
      - name: Check out Flow compiler
        uses: actions/checkout@v4
        with:
          repository: flooooooooooow/flow
          path: flow-sdk
          persist-credentials: false
      - name: Install Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: '4.0.13'
      - name: Verify Emscripten
        run: emcc --version
      - name: Validate website JavaScript
        run: |
          node --check site/site.js
          node --check scripts/smoke-browser.mjs
          node --check site/garden-webgpu.mjs
      - name: Generate both WebGPU WGSL and Metal shaders from Flow's GPU pipeline
        run: |
          ./flow-sdk/flow run src/garden_gpu.flow
          test -s dist/gpu/garden_scene/sh0_garden.wgsl
          test -s dist/gpu/garden_scene/sh0_garden.metal
          grep -q 'Generated from Flow by' dist/gpu/garden_scene/sh0_garden.wgsl
      - name: Build actual Flow garden to WebAssembly
        run: |
          ./flow-sdk/flow wasm src/garden.flow --backend=c --emcc-flag=-msimd128 --out dist/garden
          test -s dist/garden/index.html
          test -s dist/garden/garden.wasm
          test -s dist/garden/garden.js
      - name: Install immersive garden canvas stylesheet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page = Path("dist/garden/index.html")
          html = page.read_text()
          assert "</head>" in html
          html = html.replace("</head>", '<link rel="stylesheet" href="../embed.css?v=visible-canvas-2"><script type="module" src="../garden-webgpu.mjs"></script></head>')
          page.write_text(html)
          PY
      - name: Prepare website and stamp source revision
        run: |
          cp -R site/. dist/
          touch dist/.nojekyll
          test -s dist/index.html
          test -s dist/embed.css
          test -s dist/garden-webgpu.mjs
          test -s dist/gpu/garden_scene/sh0_garden.wgsl
          grep -q '../embed.css' dist/garden/index.html
          python3 - <<'PY'
          import os
          from pathlib import Path
          page = Path("dist/index.html")
          source = page.read_text()
          assert "</head>" in source
          source = source.replace("</head>", '<meta name="flow-commit" content="' + os.environ["GITHUB_SHA"] + '"></head>')
          page.write_text(source)
          PY
      - name: Smoke-test the real WebAssembly canvas in Chrome
        run: |
          npm install --no-save --ignore-scripts playwright-core@1.55.1
          node scripts/smoke-browser.mjs
      - name: Verify real WebGPU raster execution using SwiftShader in Chromium
        env:
          GARDEN_TEST_WEBGPU: '1'
        run: node scripts/smoke-browser.mjs
      - name: Publish verified compiled site to the active branch-based Pages source
        if: github.ref == 'refs/heads/main'
        run: |
          # The repository also has a legacy branch-based Pages publisher.
          # Mirroring prevents it from replacing the live WASM app with a
          # README-only Jekyll site after later repository updates.
          mkdir -p garden
          cp dist/index.html dist/site.js dist/style.css dist/embed.css dist/flower.svg dist/garden-webgpu.mjs ./
          mkdir -p gpu/garden_scene
          cp dist/gpu/garden_scene/sh0_garden.wgsl gpu/garden_scene/
          cp dist/garden/index.html dist/garden/garden.js dist/garden/garden.wasm garden/
          cp dist/.nojekyll ./
          git add -f .nojekyll index.html site.js style.css embed.css flower.svg garden-webgpu.mjs gpu/garden_scene/sh0_garden.wgsl garden/index.html garden/garden.js garden/garden.wasm
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "deploy: mirror verified WASM garden for branch-based Pages"
            # Documentation or CI commits can land during WebAssembly compilation.
            # Rebase this generated-site commit onto the current branch tip.
            # Never force-push; fail if files genuinely conflict.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" = 3 ]; then exit 1; fi
            done
          fi
      - name: Upload browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-garden-browser-render
          path: |
            /tmp/flow-garden-browser-smoke.png
            /tmp/flow-garden-mobile-smoke.png
          if-no-files-found: ignore
      - name: Upload site preview
        uses: actions/upload-artifact@v4
        with:
          name: flow-garden-site
          path: dist/
          include-hidden-files: true

  verify-live:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out browser smoke script
        uses: actions/checkout@v4
      - name: Install browser smoke dependency
        run: npm install --no-save --ignore-scripts playwright-core@1.55.1
      - name: Verify actual public GitHub Pages is live and visible
        env:
          GARDEN_TEST_URL: https://godofecht.github.io/flow-gun/?smoke=${{ github.run_id }}
          GARDEN_EXPECTED_SHA: ${{ github.sha }}
        run: |
          for attempt in 1 2 3 4; do
            if node scripts/smoke-browser.mjs; then
              exit 0
            fi
            echo "Public Pages not yet ready on attempt $attempt; retrying after CDN propagation..."
            sleep 20
          done
          exit 1
      - name: Upload public browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-garden-public-live-proof
          path: |
            /tmp/flow-garden-browser-smoke.png
            /tmp/flow-garden-mobile-smoke.png
          if-no-files-found: ignore
