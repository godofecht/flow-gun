name: Publish Flow Garden website

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flow-garden-pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: write
    outputs:
      pages_ready: ${{ steps.pages-config.outcome == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out garden
        uses: actions/checkout@v4
      - name: Check out Flow compiler
        uses: actions/checkout@v4
        with:
          repository: flooooooooooow/flow
          path: flow-sdk
          persist-credentials: false
      - name: Install Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: '4.0.13'
      - name: Verify Emscripten
        run: emcc --version
      - name: Validate website JavaScript
        run: node --check site/site.js
      - name: Build actual Flow garden to WebAssembly
        run: |
          ./flow-sdk/flow wasm src/garden.flow --backend=c --out dist/garden
          test -s dist/garden/index.html
          test -s dist/garden/garden.wasm
          test -s dist/garden/garden.js
      - name: Install immersive garden canvas stylesheet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page = Path("dist/garden/index.html")
          html = page.read_text()
          assert "</head>" in html
          html = html.replace("</head>", '<link rel="stylesheet" href="../embed.css">\\n</head>')
          page.write_text(html)
          PY
      - name: Prepare website
        run: |
          cp -R site/. dist/
          touch dist/.nojekyll
          test -s dist/index.html
          test -s dist/embed.css
          grep -q '../embed.css' dist/garden/index.html
      - name: Upload site preview
        uses: actions/upload-artifact@v4
        with:
          name: flow-garden-site
          path: dist/
          include-hidden-files: true
      - name: Configure GitHub Pages
        id: pages-config
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: steps.pages-config.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.pages_ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish
        id: publish
        uses: actions/deploy-pages@v4
